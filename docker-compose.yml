version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5332:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sentinel-net

  # 2. Redis Velocity Cache
  redis:
    image: redis:alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-net

  # 3. Python AI Worker (FastAPI + ChromaDB + Gemini)
  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    container_name: ai-worker
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JAVA_ANCHOR_URL=http://sentinel-anchor:8080/api/v1
    depends_on:
      - postgres
      - redis
    networks:
      - sentinel-net

  # 4. Java Core Banking Anchor (Spring Boot)
  sentinel-anchor:
    build:
      context: ./sentinel-anchor
      dockerfile: Dockerfile
    container_name: sentinel-anchor
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_WORKER_URL=http://ai-worker:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-worker:
        condition: service_started
    networks:
      - sentinel-net

volumes:
  postgres_data:

networks:
  sentinel-net:
    driver: bridge
