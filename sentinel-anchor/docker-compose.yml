services:
  postgres:
    image: postgres:latest
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5332:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
